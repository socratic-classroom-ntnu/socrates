name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: socrates
          POSTGRES_PASSWORD: socrates
          POSTGRES_DB: socrates
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U socrates"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://socrates:socrates@localhost:5432/socrates
      LADDER_PATH: ${{ github.workspace }}/ladders/trolley.yaml
      SCRIPT_PATH: ${{ github.workspace }}/scripts/trolley.script.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python -m mypy backend/app
      - run: python -m pytest tests -v
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend

  contract:
    runs-on: ubuntu-latest
    env:
      LADDER_PATH: ${{ github.workspace }}/ladders/trolley.yaml
      SCRIPT_PATH: ${{ github.workspace }}/scripts/trolley.script.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: ./scripts/gen_types.sh
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api/types.ts
