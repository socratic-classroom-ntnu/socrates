name: Stage Deploy
on:
  workflow_call:
    inputs:
      source_sha: {required: true, type: string}
      backend_image: {required: true, type: string}
      frontend_image: {required: true, type: string}
permissions: {contents: read, packages: read}
concurrency:
  group: socrates-stage-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux, socrates-stage]
    environment: stage
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Adopt exact application images
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          FRONTEND_IMAGE: ${{ inputs.frontend_image }}
          DATABASE_URL: ${{ secrets.SOCRATES_DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SOCRATES_PROVIDER_MASTER_KEY: ${{ secrets.SOCRATES_PROVIDER_MASTER_KEY }}
          SOCRATES_PROVIDER_KEY_VERSION: ${{ vars.SOCRATES_PROVIDER_KEY_VERSION }}
          SOCRATES_MAIL_TRANSPORT: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ vars.RESEND_FROM }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PUBLIC_ORIGIN: ${{ vars.SOCRATES_PUBLIC_ORIGIN || 'https://socrates.driseam.com' }}
          ALLOWED_ORIGINS: ${{ vars.SOCRATES_ALLOWED_ORIGINS || vars.SOCRATES_PUBLIC_ORIGIN || 'https://socrates.driseam.com' }}
        run: |
          set -Eeuo pipefail
          export SOCRATES_SOURCE_SHA="$SOURCE_SHA"
          export SOCRATES_PUBLIC_ORIGIN="$PUBLIC_ORIGIN"
          export SOCRATES_ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
          export RUN2_COOKIE_SECURE=true
          docker compose -f deploy/stage/compose.yml pull
          docker compose -f deploy/stage/compose.yml up -d --no-build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v2/readiness; then break; fi
            sleep 2
          done
          readiness="$(curl -fsS http://127.0.0.1:8080/api/v2/readiness)"
          printf '%s\n' "$readiness"
          python - "$readiness" <<'PY'
          import json, sys
          value = json.loads(sys.argv[1])
          migration = value.get("provider_key_migration", {})
          if migration.get("legacy_remaining") != 0:
              raise SystemExit(f"PROVIDER_KEY_MIGRATION_PARTIAL:{migration}")
          if migration.get("state") not in {"CURRENT", "MIGRATED"}:
              raise SystemExit(f"PROVIDER_KEY_MIGRATION_STATE:{migration}")
          PY
          curl -fsS http://127.0.0.1:8080/api/release
