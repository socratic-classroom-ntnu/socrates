services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: socrates
      POSTGRES_PASSWORD: socrates
      POSTGRES_DB: socrates
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socrates"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://socrates:socrates@db:5432/socrates
      LADDER_PATH: /app/ladders/trolley.yaml
      SCRIPT_PATH: /app/scripts/trolley.script.yaml
    volumes:
      - ./backend:/app
      - ./ladders:/app/ladders
      - ./scripts:/app/scripts
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    volumes:
      - ./frontend/src:/app/src
    ports: ["5173:5173"]
    depends_on: [backend]
    command: npm run dev
