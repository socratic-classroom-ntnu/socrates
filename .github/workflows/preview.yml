name: Preview
# PRs labelled `preview` get their own environment at
# https://pr-<number>.socrates.driseam.com (deploy/preview/README.md).
# Every new PR gets the label automatically; remove it to opt out.
# This only publishes images tagged sha-<PR head sha>; Flux Operator in
# flux-k8s (apps/base/socrates-preview) polls the labelled PRs and deploys
# that tag, then deletes the whole environment when the PR closes or the
# label is removed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
# A new push supersedes the running build. Any other label (frontend, P1,
# preview-llm...) does nothing here, so it gets a group of its own instead of
# cancelling a build that is still needed.
concurrency:
  group: >-
    socrates-preview-${{ github.event.pull_request.number }}${{
    github.event.action == 'labeled' && github.event.label.name != 'preview'
    && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true
env:
  REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  SHA: ${{ github.event.pull_request.head.sha }}
  URL: https://pr-${{ github.event.pull_request.number }}.socrates.driseam.com
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
jobs:
  # A label added with GITHUB_TOKEN triggers no workflow, so the `opened` run
  # labels the PR and builds in the same run instead of waiting for `labeled`.
  label:
    if: >-
      github.event.action == 'opened'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !contains(github.event.pull_request.labels.*.name, 'preview')
      && !startsWith(github.event.pull_request.head.ref, 'backend/arthur/')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {pull-requests: write}
    steps:
      - run: gh pr edit "$PR" --repo "$REPO" --add-label preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
  # stage-release.yml builds against the lock CI accepted; here that is the PR's own lock.
  # It also tells the PR right away that a new commit is building, so nobody
  # mistakes the still-running old commit for this one.
  lock:
    # Fork PRs cannot push to GHCR; backend/arthur/** branches skip previews. Adding some other label (e.g. preview-llm) must not rebuild.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.event.pull_request.head.ref, 'backend/arthur/')
      && (github.event.action == 'opened'
          || (github.event.action == 'labeled' && github.event.label.name == 'preview')
          || (github.event.action != 'labeled'
              && contains(github.event.pull_request.labels.*.name, 'preview')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: read, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}'}
      - uses: actions/upload-artifact@v4
        with: {name: frontend-build-lock, path: frontend/package-lock.json, retention-days: 1}
      # The helper comes from the merge commit (github.sha), not the PR head:
      # a branch opened before this workflow existed has no .github/scripts.
      - uses: actions/checkout@v4
        with: {path: helper, sparse-checkout: .github/scripts}
      - run: helper/.github/scripts/preview-comment.sh building
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: [lock]
    permissions: {contents: read, packages: write}
    uses: ./.github/workflows/stage-release.yml
    with:
      source_sha: '${{ github.event.pull_request.head.sha }}'
      channel: 'pr-${{ github.event.pull_request.number }}'
  # Flux Operator picks the new image up within a few minutes. Wait until the
  # preview actually serves this commit, then update the same comment. Runs
  # after a failed build too, so the comment never stays at "building".
  announce:
    needs: [lock, build]
    if: >-
      always() && needs.lock.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github/scripts}
      # Both halves roll out separately: the backend answers /api/release, the
      # frontend serves /revision.json. Only call it deployed when both match,
      # except that a PR branch older than /revision.json cannot report it.
      # Bounded by a deadline, not a count: each curl may take its full -m 10.
      - name: Wait for the preview to serve this commit
        id: wait
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha_of() {
            curl -fsS -m 10 "$URL$1" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("source_sha", ""))' 2>/dev/null || true
          }
          frontend=$SHA
          if ! gh api -H 'Accept: application/vnd.github.raw' \
              "repos/$REPO/contents/deploy/stage/frontend.Dockerfile?ref=$SHA" | grep -q revision.json; then
            frontend=skip
          fi
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$(sha_of /api/release)" = "$SHA" ] \
                && { [ "$frontend" = skip ] || [ "$(sha_of /revision.json)" = "$SHA" ]; }; then
              echo "state=deployed" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 10
          done
          echo "state=timeout" >> "$GITHUB_OUTPUT"
      - run: .github/scripts/preview-comment.sh "${STATE:-failed}"
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.wait.outputs.state }}
