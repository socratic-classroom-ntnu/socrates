# 備註：案件仍在審理中，討論聚焦強制撤離的兩難，避免評斷被告
- id: forced-evacuation
  title: 堰塞湖要潰決了，該不該把不願走的人強制帶走？
  body: 2025年9月，花蓮馬太鞍溪堰塞湖在颱風豪雨中溢流潰決，洪水沖進光復鄉，造成19人死亡、5人失蹤。潰決前一天已發布紅色警戒、建議強制撤離，但許多居民仍留在家中，事後鄉長等人被起訴。災後社會爭論政府是否該更強硬。支持強制撤離的人認為，生命無法挽回，寧可撤錯也不能撤漏，必要時就該把人帶走。反對的人則指出，撤離範圍兩天內從約700人暴增到約8000人，預測常有誤差，如果一再強迫撤離卻沒出事，民眾會不再相信警報；有些長輩不願離開家園，強迫他們住進收容所，也可能傷害健康與尊嚴。如果你是鄉長，面對堅持不走的長輩，你會強制把他們帶離家園嗎？
  category: life
  recommended: true

# 出處：報導者〈零撲殺上路六年追蹤報導：生態衝突篇〉；聯合報（2026/4 生多所統計）
# 備註：可補充遊蕩犬傷人、狂犬病等公衛面向；避免播放動物受傷畫面
- id: stray-dogs-wildlife
  title: 零撲殺之後，狗與石虎誰該被保護？
  body: 台灣2017年起實施收容所「零撲殺」政策，不再對收容期滿的動物安樂死。立意是尊重生命，但收容所很快爆滿，進不了收容所的遊蕩犬留在街頭與山區。農業部生物多樣性研究所統計，零撲殺上路後，因犬貓攻擊而送救傷的野生動物是先前的1.84倍，穿山甲受害最多；《報導者》也報導，高雄壽山的山羌銳減九成，石虎屢傳遭狗咬死。保育人士主張移除野外遊蕩犬，必要時應恢復安樂死；動保團體則認為源頭是棄養與繁殖買賣，不該讓狗為人類的錯誤付出生命。為了保護瀕危的野生動物，你認為可以撲殺遊蕩犬嗎？
  category: life
  recommended: true

# 出處：羅伯・薩波斯基《命定》（Determined，2023；有繁體中文版）
# 備註：可接在死刑題之後討論；可提新分類「心靈與自由意志」
- id: punishment-without-free-will
  title: 如果沒有自由意志，還能懲罰犯錯的人嗎？
  body: 美國史丹佛大學神經科學家薩波斯基（Robert Sapolsky）在2023年出版的《命定》中主張：人的每個行為，都是由前一秒的神經活動、前一天的荷爾蒙、童年經歷、基因和文化等一連串原因造成的，中間沒有自由意志插手的空間。他指出，過去人們把癲癇當成惡魔附身，後來才知道是疾病；同樣地，我們越了解行為背後的原因，就越不該為了報應而懲罰人，而應把重點放在保護社會和矯正。批評者則擔心，如果沒有人該為自己的行為負責，努力和讚美也失去意義。如果一個人的所作所為都是基因和環境造成的，你認為他還應該為自己的錯誤受罰嗎？
  category: life
  recommended: true

# 出處：中央社（2025/1/16–17）；憲法法庭113年憲判字第8號
# 備註：課堂上避免描述犯罪細節；可接在薩波斯基「沒有自由意志」一題之後
- id: death-penalty
  title: 憲法法庭說死刑合憲，國家該繼續執行嗎？
  body: 2024年9月，台灣憲法法庭判決死刑在「最嚴重的犯罪」且經最嚴密程序時合憲，但大幅限縮判死條件。2025年1月，法務部執行判決後首例死刑，對象是2013年殺害前女友與其母親的黃麟凱，被害者父親說，等了12年才等到遲來的正義。支持死刑的人認為，奪走他人生命的人應付出同等代價，這是對被害者家屬的交代，也是社會正義的底線。反對的人則認為，司法可能誤判，人死不能復生；國家用殺人來懲罰殺人自相矛盾；也沒有足夠證據證明死刑比終身監禁更能嚇阻犯罪，人權團體也批評這次執行事前毫無預警。你認為國家應該擁有剝奪一個人生命的權力嗎？
  category: life
  recommended: false

# 出處：改寫自邁可・桑德爾《成功的反思》（The Tyranny of Merit，2020）
# 備註：和學生切身相關；放不進現有分類時可提新分類「公平與運氣」
- id: deserved-grades
  title: 你的好成績，是你「應得」的嗎？
  body: 2019年，美國爆出名人和富商花錢買通教練、找人代考，把孩子送進名校的醜聞，引起公憤。哈佛大學哲學家桑德爾（Michael Sandel）在《成功的反思》中卻提出更難回答的問題：就算完全沒作弊，靠努力考上名校的人，真的是「應得」的嗎？能夠專心讀書、上補習班、有人陪伴的環境，以及天生的資質，大多是運氣。他擔心，當社會相信「成功全靠自己」，贏的人容易看不起輸的人，輸的人則覺得失敗都是自己的錯。他甚至建議，名校可以在達到門檻的申請者中抽籤錄取。反對者則認為，否定努力的價值，會讓人失去前進的動力。你在學校得到的好成績，你覺得完全是你「應得」的嗎？
  category: life
  recommended: true

# 出處：《病人自主權利法》第5條；中央社（2019/4/6）；康健雜誌
# 備註：可讓學生先想自己的家人會怎麼做
- id: tell-grandma-cancer
  title: 家人要醫生別告訴阿嬤她得了癌症，該說嗎？
  body: 在台灣，家屬要求醫師「不要讓阿嬤知道她得了癌症」的情況並不少見。2019年施行的《病人自主權利法》規定，醫師原則上應告知病人本人，病人沒有反對時才可以告訴家屬。支持誠實告知的人認為，身體是病人自己的，只有知道真相，他才能決定要不要接受辛苦的治療、怎麼安排剩下的時間、想跟誰道別，隱瞞等於剝奪他最後的選擇。主張隱瞞的家屬則認為，有些長輩一聽到「癌症」就失去求生意志，與其讓他在恐懼中度過最後的日子，不如讓他安心；家人最了解他，本來就該替他承擔壞消息。如果你是那位醫師，家屬苦苦哀求你別說，你會告訴病人真相嗎？
  category: honesty
  recommended: true

# 出處：Reuters、JURIST（2020/9/2 美國第九巡迴上訴法院裁定）
# 備註：可延伸討論內部檢舉管道能否真正保護揭弊者
- id: snowden-leak
  title: 洩露國家機密揭發監聽，是英雄還是叛徒？
  body: 2013年，美國國家安全局（NSA）的外包人員史諾登（Edward Snowden）把大量機密文件交給記者，揭露政府秘密蒐集數百萬名美國民眾的通話紀錄。他違反了保密承諾與法律，隨後滯留俄羅斯，至今仍在美國面臨間諜罪起訴。2020年，美國聯邦上訴法院認定那項大規模蒐集通話紀錄的計畫違法。支持者認為，他讓人民知道政府違法侵犯隱私，若沒有人說出真相，濫權永遠不會被糾正。批評者則認為，他洩露的文件遠超過揭發弊端所需，可能危害情報人員與國家安全，而且應先走內部檢舉管道，不該由個人決定公開哪些機密。如果你發現所屬的組織在做違法的事，但說出來就得違背承諾、甚至觸法，你會公開真相嗎？
  category: honesty
  recommended: true

# 出處：Food Poisoning Bulletin、Farm Forward（2008 Hallmark/Westland 事件）；NPR、ALDF（農業封口法判決）
# 備註：可對照台灣記者臥底採訪的案例
- id: undercover-slaughterhouse
  title: 為了揭發虐待動物，可以假扮員工偷拍嗎？
  body: 2008年，美國人道協會的調查員應徵進入一家屠宰場工作，偷偷拍下工人用堆高機推、用電擊棒驅趕站不起來的病牛。這些牛依規定不該進入食物供應鏈，影片曝光後，政府下令召回大量牛肉，部分原本供應學校午餐。之後美國多州通過俗稱「農業封口法」的法律，禁止未經同意在農場偷拍，其中多條後來被法院以侵犯言論自由宣告違憲。支持臥底的人認為，若不偷拍，外界永遠看不到圍牆內的真相。反對的人則認為，假冒身分取得工作本身就是欺騙，偷拍侵犯業者財產與其他員工的隱私，影片也可能被剪接而誤導大眾。為了揭露重大的不當行為，你認為可以用欺騙的方式取得證據嗎？
  category: honesty
  recommended: true

# 出處：CBC News（Hogewey 報導）；The New World（2026）；Israel Journal of Health Policy Research（2019）
# 備註：Hogeweyk 創辦人強調村子不是舞台布景、員工不是演員；「假公車站」是其他機構的做法
- id: dementia-village
  title: 為失智長輩打造「假的」世界，是體貼還是欺騙？
  body: 荷蘭有一座專為重度失智長者設計的「失智村」霍格威克（Hogeweyk），村裡有超市、餐廳、劇院和街道，店員和鄰居多半是照護人員，長者可以在安全範圍內自由散步、買東西，像從前一樣生活。有些照護機構走得更遠：在門口設置不會有公車停靠的「假公車站」，長者吵著要回家時，就陪他到站牌等車，等他忘了要去哪裡再帶回室內。支持者認為，這能減少長者的焦慮與衝突，讓他們有尊嚴地生活，比把人鎖在病房好得多。批評者則認為，這是對最脆弱的人有計畫地說謊，長者一旦察覺，可能更加混亂、痛苦。如果你的家人罹患重度失智，你會希望照顧者用這種「善意的布景」陪伴他嗎？
  category: honesty
  recommended: true

# 出處：報導者（非本國籍兒童國籍問題報導）；品傳媒（2025/9）；Newtalk（2026/4 失聯移工人數）
# 備註：可補充出生地主義（美、加）與血統主義（台灣）的差異
- id: birthright-citizenship
  title: 在台灣出生的孩子，該自動成為台灣人嗎？
  body: 台灣目前有約9萬名失聯移工。有些女性移工懷孕後，因為擔心被解僱或遣返而逃離工作，孩子出生後也不敢報戶口。台灣國籍主要依父母血統認定，這些孩子沒有中華民國國籍，常常也拿不到母國的身分文件，沒有健保、就學困難。支持給予身分的人認為，孩子無法選擇父母，不該替大人的違法付出代價；美國、加拿大等國也讓在當地出生的孩子自動取得國籍。反對的人則擔心，這會鼓勵更多人逃逸或來台生子，對依法申請居留的人不公平；而且國籍代表與國家的長期連結，不應只因為在這裡出生就自動取得。你認為在台灣出生的孩子，應該自動取得台灣國籍嗎？
  category: self
  recommended: true

# 出處：報導者（2022/10 釋憲報導）；中央社、公視（2026/7/30）
# 備註：班上若有原住民學生，討論時留意不要讓個人代表整個族群發言
- id: siraya-indigenous-status
  title: 祖先是原住民，就該擁有原住民身分嗎？
  body: 西拉雅族是台灣南部的平埔族群，因過去政府只在少數幾年開放登記，大多數族人沒有取得原住民身分。2026年7月，行政院核定西拉雅族為台灣第17個原住民族，預估首年約5萬人登記。支持的人認為，這是遲來的歷史正義：族人的身分曾因國家制度被抹去，理應恢復，語言和文化也才能得到資源復振。有疑慮的人則指出，許多登記者已不會說族語、不參與祭儀，生活方式和一般漢人無異，未來若與既有原住民共享升學、就業保障和立委席次等資源，可能排擠原本就弱勢的族人。你認為一個人只要祖先是原住民，即使從小不在原住民文化中長大，也應該擁有原住民身分嗎？
  category: self
  recommended: false

# 出處：報導者〈當血緣不再是祕密〉專題（2026/1）；Euronews／EBU（2025/12/10）；元照《月旦醫事法報告》
# 備註：人工生殖法修法仍在進行中，使用前可確認最新進度
- id: donor-anonymity
  title: 捐精者該不該匿名？孩子有權知道生父是誰嗎？
  body: 台灣每年約有700個孩子透過匿名捐贈的精卵出生，依現行規定，他們頂多知道捐贈者的國籍、膚色、血型，無法得知對方是誰。2025年歐洲爆出一名捐精者帶有致癌基因突變、精子被用來孕育近200個孩子，讓身世知情權再受關注；台灣人工生殖法修法草案也首度寫入身世告知。支持公開的人認為，知道自己從哪裡來是自我認同的一部分，也攸關遺傳疾病風險，瑞典早在1985年就讓孩子成年後可查詢捐贈者。反對的人則指出，捐贈者是在匿名承諾下捐贈，公開會侵犯隱私，也可能讓願意捐贈的人大減。你認為透過捐精出生的孩子，成年後有權知道捐贈者是誰嗎？
  category: self
  recommended: false

# 出處：經典實驗：Libet 等人，Brain 期刊（1983）；Schurger 等人，PNAS（2012）的重新解讀
# 備註：可提新分類「心靈與自由意志」
- id: libet-experiment
  title: 大腦比你先「決定」了嗎？李貝特的實驗
  body: 1980年代，美國神經科學家李貝特（Benjamin Libet）請受試者在想動的時候隨時動一下手腕，並記下自己「決定要動」的那一刻。結果發現，大腦中準備動作的電訊號，比受試者自覺做出決定還早了大約三分之一秒出現。許多人因此認為：在你意識到「我要動」之前，大腦其實已經決定好了，自由意志可能只是事後的感覺。不過李貝特本人認為，人仍保有在最後一刻「喊停」的能力；後來也有研究者質疑，那個訊號可能只是大腦隨機的波動，不代表真正的決定。如果你的大腦總是在你察覺之前就做好決定，你覺得那還算是「你」的選擇嗎？
  category: self
  recommended: true

# 出處：辛頓接受英國LBC電台Andrew Marr訪談、Big Technology Podcast訪談（神經元替換論證）
# 備註：形式像忒修斯之船（逐步替換），但問的是意識能否存在於非生物，不是物體同一性；可提新分類「心靈與自由意志」
- id: neuron-replacement
  title: 把大腦的神經元一個個換掉，你還有意識嗎？
  body: 2024年諾貝爾物理學獎得主、被稱為「AI教父」的辛頓（Geoffrey Hinton）在訪談中提出一個測試：假設把你大腦裡的一個神經元，換成一小塊奈米科技零件，它接收和送出訊號的方式和原本完全一樣。只換一個，你應該還有意識。那換第二個、第三個呢？一路換下去，直到整顆大腦都是人造零件，而你的言行和原本完全相同。辛頓據此認為，意識不一定只屬於生物，現在的AI可能已經有意識；許多學者則反對，認為「功能一樣」不等於「感受一樣」。如果你的神經元被一個個換成晶片，換到最後，你覺得那還是有意識的你嗎？
  category: self
  recommended: true

# 出處：OpenAI GitHub openai/math（2026/10/6）；AHM聲明（陶哲軒部落格，2026/10/7）；Retraction Watch（2026/10/8）
# 備註：數字以2026年10月報導為準
- id: ai-math-papers
  title: AI一次發表722篇數學論文，沒人看懂的證明算數嗎？
  body: 2026年10月，OpenAI一次公開722篇AI寫成的數學論文，聲稱解決一百多個長年未解的難題。這些論文未經同儕審查，只有部分附上電腦可驗證的證明；不到一天就有人發現一篇證明出現正負號錯誤，OpenAI撤回3篇。數學家團體「人類數學協會」呼籲停止與OpenAI合作，菲爾茲獎得主陶哲軒也轉貼聲明，擔憂解題者只求「解掉」題目卻不理解答案。他們認為，沒人看懂的證明不算真正的知識，出錯也沒人能負責。支持者則認為，兩週內已有數學家確認其中關鍵結果正確，AI能大幅加速發現，不該因為人類跟不上就停下。當AI產出知識的速度遠超過人類檢驗的速度，你認為科技發展需要放慢腳步，等人類跟上嗎？
  category: tech
  recommended: false

# 出處：NPR（2025/5/7）；KJZZ（2026/10/30 上訴法院裁定）
# 備註：也可放「誠實」：AI替死者說的話算不算他的話
- id: ai-victim-statement
  title: 死者透過AI在法庭上「原諒」兇手，可以嗎？
  body: 2021年，美國亞利桑那州的克里斯・佩爾基在行車糾紛中遭槍殺。2025年兇手量刑時，他的姊姊用AI合成一段影片，以哥哥的照片和聲音，讓「他」在法庭上對兇手表達原諒。講稿由姊姊撰寫，法官表示深受感動。支持的人認為，被害者已無法為自己發聲，家屬最了解他，AI只是讓大家看見他是怎樣的人，就像播放照片和影片一樣。反對的人則認為，那些話終究不是死者本人說的，卻用他的臉和聲音說出來，容易讓人誤以為是真的；法庭講求證據與理性，用AI打動情緒可能影響判決的公平。2026年10月，州上訴法院就認定影片不當影響了法官，裁定重新量刑。如果你是家屬，你會用AI讓過世的親人在法庭上「說話」嗎？
  category: tech
  recommended: true

# 出處：Reuters、NBC News（2026/1/15–16 澳洲eSafety數據）；The Next Web（2026）
# 備註：和學生切身相關，討論熱度高
- id: teen-social-media-ban
  title: 16歲以下禁用社群媒體，是保護還是剝奪？
  body: 2025年12月10日，澳洲成為全球第一個禁止16歲以下青少年使用主流社群媒體的國家。Instagram、TikTok、YouTube等10個平台必須找出並停用未滿16歲用戶的帳號，否則最高可罰4950萬澳幣，但不處罰孩子和家長。上路第一個月，平台就停用了約470萬個帳號。政府認為這能保護孩子免於網路成癮、霸凌與有害內容；批評者則擔心孩子失去與朋友聯繫、取得資訊的管道，年齡驗證也可能侵犯隱私。也有研究指出，禁令上路的前三個月，仍有超過八成未滿16歲的孩子在用社群媒體。如果台灣也實施同樣的規定，你會支持嗎？
  category: tech
  recommended: true

# 出處：Variety、Reuters（2025/9/30–10/1）
# 備註：可延伸討論AI訓練資料的著作權
- id: ai-actor
  title: 電影公司可以用AI演員取代真人演員嗎？
  body: 2025年9月，一名荷蘭製作人在影視產業論壇上介紹由AI生成的「演員」蒂莉・諾伍德（Tilly Norwood），並說已有經紀公司想簽下她。好萊塢演員工會隨即聲明，她「不是演員」，而是用無數真人演員的作品訓練、卻沒經同意也沒付費的電腦程式。支持AI演員的人認為，這是新的創作工具，就像動畫和電腦特效，能大幅降低拍片成本，讓小團隊也拍得出電影，觀眾也有權選擇想看什麼。反對的人則擔心，AI會奪走演員、替身和配音員的工作，而它的「演技」其實是複製真人表演而來，表演藝術中人的情感與經驗也可能被取代。你認為電影公司應該被允許用AI演員取代真人演員嗎？
  category: tech
  recommended: true

# 出處：改寫自哈拉瑞《人類大歷史》（Sapiens，2011）論農業革命「史上最大騙局」的章節
# 備註：把農業視為一種技術而歸入科技；可提新分類「歷史與進步」
- id: wheat-domestication
  title: 是人類馴化了小麥，還是小麥馴化了人類？
  body: 我們通常認為農業革命是人類的一大進步。但哈拉瑞在《人類大歷史》中提出相反的看法：狩獵採集者每天工作的時間較短、食物種類多樣；改種小麥後，人們得整天彎腰除草、挑水、驅趕害蟲，飲食變得單調，還要面對旱災、饑荒和傳染病。從小麥的角度看，它從中東一角的野草擴散到全世界，數量暴增，反倒像是小麥「馴化」了人類。他稱農業革命是「史上最大的騙局」：人口變多了，但個人的生活不一定變好。也有學者批評這種說法過度美化了狩獵採集生活，現代的醫學、文字和藝術，都建立在農業帶來的穩定社會之上。你認為農業革命是人類的一次進步嗎？
  category: tech
  recommended: true

# 出處：MIT Technology Review（2025/12/5）；關鍵評論網（2025/6）；The Economist；Cell 期刊研究（胚胎篩選平均智商增益）
# 備註：也可放「生命與責任」；美國醫學遺傳學會認為多基因胚胎篩選目前沒有已證實的臨床效益
- id: embryo-selection
  title: 花錢幫孩子「挑」出更聰明的胚胎，可以嗎？
  body: 2025年底，美國紐約地鐵出現大量廣告：「生下你最好的寶寶」「智商有一半來自基因」。刊登廣告的新創公司Nucleus Genomics和其他幾家公司一樣，為做試管嬰兒的父母分析多個胚胎的基因，不只篩檢疾病風險，還預測未來的身高、眼睛顏色甚至智商，讓父母挑分數最高的胚胎植入，費用可達數萬美元。支持的人認為，父母本來就會替孩子選好學校、好營養，在出生前降低疾病風險、給孩子更好的起點，是父母的權利，也是一種愛。反對的人則批評這是新型優生學，只有有錢人負擔得起，可能擴大貧富差距；醫學界也指出預測準確度有限，研究估計平均只能多出約2.5分智商。如果技術安全合法、你也負擔得起，你會為未來的孩子篩選胚胎嗎？
  category: tech
  recommended: true
