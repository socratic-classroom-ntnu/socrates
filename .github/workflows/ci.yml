name: CI
on:
  # backend/arthur/** 由本機 CI 檢查：以它為 base 的疊層 PR 與它的 push 都不跑；
  # PR 進 develop 時照常跑完整 CI（pull_request 的 branches 比對的是 base 分支）。
  pull_request:
    branches-ignore: ['backend/arthur/**']
  push:
    branches: [master, develop, stage, 'backend/**', '!backend/arthur/**']
permissions:
  contents: read
concurrency:
  group: socrates-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: socrates
          POSTGRES_PASSWORD: socrates-ci
          POSTGRES_DB: socrates
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U socrates" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://socrates:socrates-ci@localhost:5432/socrates
      CLASSROOM_TEST_DATABASE_URL: postgresql+psycopg://socrates:socrates-ci@localhost:5432/socrates
      LADDER_PATH: ${{ github.workspace }}/ladders/trolley.yaml
      SCRIPT_PATH: ${{ github.workspace }}/scripts/trolley.script.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff lint, complete backend
        run: python -m ruff check backend
      - name: Ruff format, complete backend
        run: python -m ruff format --check backend
      - name: Strict Round1 types and classroom contracts
        run: |
          cd backend
          python -m mypy app --exclude 'app/api/routes/(classroom|groups|ai_students|public_config|provider_profiles|classroom_library)\.py|app/api/classroom_schemas\.py|app/orchestrator/classroom(_policy)?\.py|app/domain/(group_run|group_analysis|library_decisions)\.py|app/repositories/classroom_storage\.py|app/services/(classroom|llm_workers|email_delivery|ai_students|classroom_auth)\.py|app/tutor/(classroom_provider|classroom_gateway|prompts)\.py|app/(classroom_app|classroom_server|realtime)\.py'
          python -m mypy --config-file mypy-classroom.ini app/api/routes/classroom.py app/api/routes/groups.py app/api/routes/ai_students.py app/api/routes/public_config.py app/api/routes/provider_profiles.py app/api/routes/classroom_library.py app/api/classroom_schemas.py app/orchestrator/classroom.py app/orchestrator/classroom_policy.py app/domain/group_run.py app/domain/group_analysis.py app/domain/library_decisions.py app/repositories/classroom_storage.py app/services/classroom.py app/services/llm_workers.py app/services/email_delivery.py app/services/ai_students.py app/services/classroom_auth.py app/tutor/classroom_provider.py app/tutor/classroom_gateway.py app/tutor/prompts.py app/classroom_app.py app/realtime.py app/classroom_server.py
      - name: Database migration and domain/API regression
        run: |
          cd backend
          python -m alembic upgrade head
          python -m pytest tests -v --junitxml=backend-tests.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence
          path: backend/backend-tests.xml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Fetch source-pinned local avatar
        run: python scripts/fetch_avatar.py
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --runInBand
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-lock
          path: |
            frontend/package-lock.json
            frontend/dist
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LADDER_PATH: ${{ github.workspace }}/ladders/trolley.yaml
      SCRIPT_PATH: ${{ github.workspace }}/scripts/trolley.script.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: ./scripts/gen_types.sh
      - run: python scripts/gen_classroom_types.py
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api/types.ts frontend/classroom-openapi.json frontend/src/api/classroomTypes.ts
  # contract 對不上時，把重新產生的契約檔推回 PR 分支（只限本 repo 的分支；fork 沒有寫入權限）。
  # 用 GITHUB_TOKEN 推的 commit 不會自動跑 CI（run 會停在 action_required，要人手動核准），
  # 所以推之前先跑前端 typecheck，確認新型別不會讓前端壞掉。
  # 只修個人開發分支：develop、stage、master、backend/* 這類共用或部署分支不能收到沒跑過 CI 的 commit。
  contract-fix:
    needs: [contract]
    if: >-
      failure() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'frontend/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, pull-requests: write}
    env:
      LADDER_PATH: ${{ github.workspace }}/ladders/trolley.yaml
      SCRIPT_PATH: ${{ github.workspace }}/scripts/trolley.script.yaml
      HEAD_REF: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      CONTRACTS: frontend/openapi.json frontend/src/api/types.ts frontend/classroom-openapi.json frontend/src/api/classroomTypes.ts
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.head_ref }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: ./scripts/gen_types.sh
      - run: python scripts/gen_classroom_types.py
      - id: diff
        run: |
          if git diff --quiet -- $CONTRACTS; then
            echo "分支上的契約檔已經是最新的；不一致只出現在與 base 合併後的結果，請先 rebase 或 merge base 分支。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: npm run typecheck
        working-directory: frontend
      - if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $CONTRACTS
          git commit -m "chore(contracts): regenerate OpenAPI contracts"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          gh pr comment "$PR_NUMBER" --body "🤖 OpenAPI 契約檔跟程式碼對不上，已自動重新產生並推上 \`$(git rev-parse --short HEAD)\`（前端 typecheck 已通過）。這個 commit 的 CI 不會自動跑（停在等待核准），下次 push 時會一併檢查；要馬上檢查的話，到 Actions 頁面核准，或先 \`git pull\` 再推一個 commit。"
  round1-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for a positive health response
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health
      - run: python scripts/round1_smoke.py http://127.0.0.1:8000/api
      - if: always()
        run: docker compose logs --no-color > round1-compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: round1-evidence, path: round1-compose.log, retention-days: 7}
      - if: always()
        run: docker compose down
  classroom-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: socrates, POSTGRES_PASSWORD: socrates-ci, POSTGRES_DB: socrates_load}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U socrates" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://socrates:socrates-ci@localhost:5432/socrates_load
      CLASSROOM_COOKIE_SECURE: 'false'
      SOCRATES_ALLOWED_ORIGINS: http://127.0.0.1:8099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Two-worker, real PostgreSQL 2×60 workload
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          python scripts/classroom_load.py --output classroom-load.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-load-evidence
          path: |
            classroom-load.json
            classroom-server.log
  ci-required:
    if: always()
    runs-on: ubuntu-latest
    needs: [backend, frontend, contract, round1-e2e, classroom-load]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json,os
          jobs=json.loads(os.environ['RESULTS'])
          print(json.dumps({k:v['result'] for k,v in jobs.items()},indent=2))
          assert all(v['result']=='success' for v in jobs.values())
          PY
  # Every push to stage/develop/master publishes <channel>-<UTC ts>-<sha> images.
  # Flux deploys each channel to its own host (flux-k8s, apps/base/socrates):
  # master -> socrates.driseam.com, stage -> -qa, develop -> -dev.
  release:
    if: github.event_name == 'push' && contains(fromJSON('["stage","develop","master"]'), github.ref_name)
    needs: [ci-required]
    permissions: {contents: read, packages: write}
    uses: ./.github/workflows/stage-release.yml
    with:
      source_sha: '${{ github.sha }}'
      channel: '${{ github.ref_name }}'
