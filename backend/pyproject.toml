[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# CI 跑的是 `ruff check backend`，範圍不含 repo 根目錄的 scripts/。
# 但 root compose 把 ./scripts 掛進容器的 /app/scripts，容器內的 `ruff check .`
# 因此會多掃到 CI 不檢查的檔案。在設定裡排除，讓兩邊範圍一致，
# 也讓 check 與 format 行為相同（`ruff format` 只有會覆寫預設的 --exclude）。
extend-exclude = ["scripts"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "app.modules.classroom_core.routes",
    "app.modules.group_dialogue.routes.groups",
    "app.modules.group_dialogue.routes.ai_students",
    "app.modules.platform.routes",
    "app.modules.ai_providers.routes",
    "app.modules.classroom_core.library_routes",
    "app.modules.classroom_core.orchestrator",
    "app.modules.classroom_core.policy",
    "app.modules.group_dialogue.group_run",
    "app.modules.analytics.group_analysis",
    "app.modules.content_authoring.library_decisions",
    "app.modules.platform.storage",
    "app.modules.classroom_core.runtime",
    "app.modules.app_shell.llm_workers",
    "app.modules.identity_access.email_delivery",
    "app.modules.group_dialogue.ai_students",
    "app.modules.identity_access.auth",
    "app.modules.ai_providers.classroom_provider",
    "app.modules.ai_providers.classroom_gateway",
    "app.modules.llm_runtime.prompts",
    "app.classroom_app",
    "app.modules.classroom_core.realtime",
    "app.modules.content_authoring.routes.question_bank",
    "app.modules.content_authoring.routes.script_assist",
    "app.modules.content_authoring.scenario_ai",
    "app.modules.ai_providers.repositories",
    "app.modules.ai_providers.service",
    "app.modules.analytics.routes",
    "app.modules.classroom_core.repositories",
    "app.modules.classroom_core.service",
    "app.modules.content_authoring.repositories",
    "app.modules.group_dialogue.stance",
    "app.modules.identity_access.repositories",
    "app.modules.llm_runtime.repositories",
    "app.modules.platform.repositories",
    "app.modules.identity_access.routes",
    "app.modules.content_authoring.routes.scripts",
    "app.modules.content_authoring.service",
    "app.modules.group_dialogue.service",
    "app.classroom_server",
]
follow_imports = "skip"
ignore_errors = false
