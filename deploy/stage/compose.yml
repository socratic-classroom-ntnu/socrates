name: socrates-stage

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/socratic-classroom-ntnu/socrates-backend:stage}
    build:
      context: ../..
      dockerfile: deploy/stage/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LADDER_PATH: /app/ladders/trolley.yaml
      SCRIPT_PATH: /app/scripts/trolley.script.yaml
      SOCRATES_SOURCE_SHA: ${SOCRATES_SOURCE_SHA:-stage}
      SOCRATES_RELEASE_ID: ${SOCRATES_RELEASE_ID:-socrates-stage}
      SOCRATES_ENVIRONMENT: stage
      SOCRATES_ALEMBIC_REVISION: ${SOCRATES_ALEMBIC_REVISION:-head}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/socratic-classroom-ntnu/socrates-frontend:stage}
    build:
      context: ../..
      dockerfile: deploy/stage/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SOCRATES_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
