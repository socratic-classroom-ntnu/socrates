name: socrates-run2-local
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: socrates
      POSTGRES_PASSWORD: socrates-local-only
      POSTGRES_DB: socrates
    volumes: ['run2-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U socrates']
      interval: 3s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: ../..
      dockerfile: deploy/stage/backend.Dockerfile
      args: {SOURCE_SHA: "${SOCRATES_SOURCE_SHA:-local}"}
    environment:
      DATABASE_URL: postgresql+psycopg://socrates:socrates-local-only@db:5432/socrates
      RUN2_COOKIE_SECURE: 'false'
      SOCRATES_PUBLIC_ORIGIN: http://127.0.0.1:5180
      SOCRATES_ALLOWED_ORIGINS: http://127.0.0.1:5180,http://localhost:5180
      WEB_CONCURRENCY: '2'
      SOCRATES_SOURCE_SHA: ${SOCRATES_SOURCE_SHA:-local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ../..
      dockerfile: deploy/stage/frontend.Dockerfile
      args: {SOURCE_SHA: "${SOCRATES_SOURCE_SHA:-local}"}
    ports: ['127.0.0.1:5180:80']
    depends_on: [backend]
volumes:
  run2-pg:
