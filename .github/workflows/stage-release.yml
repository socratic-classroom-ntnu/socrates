name: Stage Release
on:
  workflow_call:
    inputs:
      source_sha: {required: true, type: string}
    outputs:
      backend_image: {value: '${{ jobs.build.outputs.backend_image }}'}
      frontend_image: {value: '${{ jobs.build.outputs.frontend_image }}'}
permissions: {contents: read, packages: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      backend_image: ${{ steps.manifest.outputs.backend_image }}
      frontend_image: ${{ steps.manifest.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.source_sha }}'}
      - name: Fetch pinned avatar bytes
        run: python scripts/fetch_avatar.py
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Consume the exact lock accepted by CI
        uses: actions/download-artifact@v4
        with: {name: frontend-build-lock, path: accepted-frontend}
      - run: cp accepted-frontend/package-lock.json frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/stage/backend.Dockerfile
          push: true
          build-args: SOURCE_SHA=${{ inputs.source_sha }}
          tags: ghcr.io/socratic-classroom-ntnu/socrates-backend:sha-${{ inputs.source_sha }}
      - id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/stage/frontend.Dockerfile
          push: true
          build-args: SOURCE_SHA=${{ inputs.source_sha }}
          tags: ghcr.io/socratic-classroom-ntnu/socrates-frontend:sha-${{ inputs.source_sha }}
      - id: manifest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BACKEND: ghcr.io/socratic-classroom-ntnu/socrates-backend@${{ steps.backend.outputs.digest }}
          FRONTEND: ghcr.io/socratic-classroom-ntnu/socrates-frontend@${{ steps.frontend.outputs.digest }}
        run: |
          python - <<'PY'
          import json,os,hashlib
          d={'schema':'socrates/run2-release/v1','source_sha':os.environ['SOURCE_SHA'],
             'backend_image':os.environ['BACKEND'],'frontend_image':os.environ['FRONTEND'],
             'lock_sha256':hashlib.sha256(open('frontend/package-lock.json','rb').read()).hexdigest()}
          open('RELEASE.json','w').write(json.dumps(d,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('backend_image='+d['backend_image']+'\nfrontend_image='+d['frontend_image']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with: {name: 'socrates-run2-release-${{ inputs.source_sha }}', path: RELEASE.json, retention-days: 30}
