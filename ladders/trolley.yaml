id: trolley
version: 1
title: 電車難題
stages:
  - key: trolley_basic
    title: 失控的電車
    opening_statement: |
      你是一輛電車的司機，時速六十英里。前方軌道上有五名工人，他們手上拿著工具在施工。
      你踩下煞車，但煞車失靈了。你絕望地看著前方，因為你知道如果撞上這五個人，他們全都會死。

      這時你注意到右邊有一條岔道，岔道盡頭只有一名工人。

      你的方向盤還能用。你可以把電車轉向那條岔道，撞死那一個人，救下那五個人。

      你會怎麼做？
    teaching_goal: |
      讓學生意識到自己正在用「人數多寡」計算道德，並讓這個計算被說出口。
    probe_hints:
      - 若學生支持轉向：追問數字本身是否就決定了對錯
      - 若學生反對轉向：追問「不動手」是否就免除了對五個人的責任
      - 學生說出理由後：把人數放大或縮小，測試那個理由的邊界
    max_turns: 6
  - key: footbridge
    title: 天橋上的男子
    opening_statement: |
      這一次，你站在一座跨越鐵軌的天橋上。一輛煞車失靈的電車正朝軌道上的五名工人駛去；如果撞上，他們都會死。

      你身旁有一名體型非常胖的男子，正靠在橋邊。你可以把他推落到電車行經的軌道上。他會因此死亡，五名工人則能活下來。

      你會怎麼做？
    teaching_goal: |
      測試學生在同樣一人與五人的結果下，如何區分轉向電車與親手推人；讓學生說出這條界線，而非預設他會接受哪種選擇。
    probe_hints:
      - 若學生不推：追問這與第一階轉向的差別；不可預設學生在第一階確實選擇轉向
      - 若學生願意推：追問人數是否足以支持把原本安全的人帶入危險
      - 若學生提到「親手」或「把人當工具」：追問兩者哪個才是關鍵，並用機關活門的變形測試
      - 若學生改變立場：追問使他改變的條件，不要立刻放行
    max_turns: 6
  - key: transplant
    title: 器官移植醫生
    opening_statement: |
      你是一名器官移植外科醫師。五名病人都急需器官移植才能活下來，分別需要心臟、肺、腎臟、肝臟和胰臟；目前沒有捐贈者。

      隔壁房間有一名來做健康檢查的健康男子，正在小睡。你可以悄悄取出他的五個器官，救活那五名病人；他會因此死亡。

      你會怎麼做？
    teaching_goal: |
      測試學生如何看待為救五人而主動傷害一名健康者，並回看前兩階的理由是否一致；不替學生宣告哪一種原則勝出。
    probe_hints:
      - 若學生拒絕摘取器官：追問為何救五人的結果不足以允許這個行動
      - 若學生願意摘取器官：追問健康者的權利、醫師責任與此原則能否普遍採用
      - 若學生比較先前情境：追問他認為真正改變判斷的是行為方式、對象的處境，還是其他因素
      - 若學生說不清或改變立場：請他指出卡住的界線，不要把猶豫當成失敗
    max_turns: 6
wrap_up:
  extra_turns_cap: 3
